{% if valores_mes == "[]" %}
  <div class="flex items-center justify-center text-base-content/60 py-12">
    Sem dados de pagamentos para apresentar.
  </div>
{% else %}
<div class="relative h-72 w-full">
  <canvas id="graficoPagamentoMes"></canvas>
</div>

<script>
  (function () {
    const ctx = document.getElementById("graficoPagamentoMes");
    if (!ctx) return;

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: {{ label_mes|safe }},
        datasets: [{
          label: "Arrecadação (AOA)",
          data: {{ valores_mes|safe }},
          backgroundColor: "rgba(79, 70, 229, 0.8)",
          borderColor: "rgba(79, 70, 229, 1)",
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (c) => "Kz " + c.parsed.y.toLocaleString("pt-AO", { minimumFractionDigits: 2 }),
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: (v) => "Kz " + Number(v).toLocaleString("pt-AO"),
            }
          }
        }
      }
    });
  })();
</script>
{% endif %}
