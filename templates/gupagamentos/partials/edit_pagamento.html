{% load widget_tweaks %}

<tr id="row-{{ pagamento.id }}">
  <td colspan="8" class="bg-base-200/60">
    <form hx-post="{% url 'gupagamentos:editar_pagamento' pagamento.id %}"
          hx-target="#row-{{ pagamento.id }}"
          hx-swap="outerHTML"
          class="p-2">
      {% csrf_token %}

      <div class="grid gap-4 sm:grid-cols-2">
        {% include 'partials/form_fields.html' %}
      </div>

      <div class="flex justify-end gap-2 mt-4">
        <button
          type="button"
          class="btn btn-sm btn-ghost"
          hx-get="{% url 'gupagamentos:editar_pagamento' pagamento.id %}?cancel=1"
          hx-target="#row-{{ pagamento.id }}"
          hx-swap="outerHTML"
        >
          Cancelar
        </button>
        <button type="submit" class="btn btn-sm btn-primary">Salvar</button>
      </div>
    </form>
  </td>
</tr>
